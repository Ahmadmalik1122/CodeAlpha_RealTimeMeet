services:
  - type: web
    name: realtimemeet-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: VERIFICATION_TOKEN_EXPIRY_HOURS
        value: 24
      - key: VERIFICATION_RESEND_COOLDOWN_SECONDS
        value: 60
      - key: PASSWORD_RESET_TOKEN_EXPIRY_MINUTES
        value: 60
      - key: PASSWORD_RESET_COOLDOWN_SECONDS
        value: 60
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
